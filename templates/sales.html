
{% extends "layout.html" %}{% block content %}<h1>Vendas e comissões</h1>
<form class="card" method="post"><div class="row"><select name="product_id" required><option value="">Produto</option>{% for p in products %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select>
<input name="amount" type="number" step="0.01" placeholder="Valor da venda"><input name="commission" type="number" step="0.01" placeholder="Comissão">
<input name="source" placeholder="Origem/campanha"></div><button class="btn">Registrar venda</button></form><div class="sp"></div>
<table><tr><th>Data</th><th>Produto</th><th>Venda</th><th>Comissão</th><th>Origem</th></tr>
{% for s in sales %}<tr><td>{{s.created_at}}</td><td>{{s.product_name}}</td><td>R$ {{'%.2f'|format(s.amount)}}</td><td>R$ {{'%.2f'|format(s.commission)}}</td><td>{{s.source}}</td></tr>
{% else %}<tr><td colspan="5">Nenhuma venda registrada.</td></tr>{% endfor %}</table>{% endblock %}
